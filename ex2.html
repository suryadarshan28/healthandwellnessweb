<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health & Wellness Registration Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f2fdf5;
        }

        .container{
            width:50%;
            margin:30px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#2e8b57;
            margin-bottom:20px;
        }

        label{
            font-weight:bold;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        input[type="radio"],
        input[type="checkbox"]{
            width:auto;
            margin-right:5px;
        }

        input[type="color"],
        input[type="file"],
        input[type="range"]{
            width:100%;
        }

        .buttons{
            text-align:center;
        }

        input[type="submit"],
        input[type="reset"]{
            width:120px;
            padding:10px;
            border:none;
            border-radius:5px;
            color:white;
            cursor:pointer;
            margin:5px;
        }

        input[type="submit"]{
            background:#2e8b57;
        }

        input[type="submit"]:hover{
            background:#1f6b42;
        }

        input[type="reset"]{
            background:#d9534f;
        }

        input[type="reset"]:hover{
            background:#b52b27;
        }

        @media screen and (max-width:768px){

            .container{
                width:90%;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Health & Wellness Registration Form</h2>

        <form>

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required>

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required>

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required>

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                min="18"
                max="80"
                required>

            <label for="dob">Date of Birth</label>
            <input
                type="date"
                id="dob"
                name="dob">

            <label>Gender</label><br><br>

            <input
                type="radio"
                name="gender"
                value="Male">
            Male

            <input
                type="radio"
                name="gender"
                value="Female">
            Female

            <input
                type="radio"
                name="gender"
                value="Other">
            Other

            <br><br>

            <label>Health Interests</label><br><br>

            <input
                type="checkbox"
                name="interest"
                value="Nutrition">
            Nutrition

            <input
                type="checkbox"
                name="interest"
                value="Fitness">
            Fitness

            <input
                type="checkbox"
                name="interest"
                value="Yoga">
            Yoga

            <input
                type="checkbox"
                name="interest"
                value="Meditation">
            Meditation

            <br><br>

            <label for="goal">Health Goal</label>

            <select id="goal" name="goal">
                <option>Weight Loss</option>
                <option>Weight Gain</option>
                <option>Muscle Building</option>
                <option>Stay Fit</option>
                <option>Improve Mental Health</option>
            </select>

            <label for="address">Address</label>

            <textarea
                id="address"
                rows="4"
                placeholder="Enter your address"></textarea>

            <label>Favorite Theme Color</label>

            <input
                type="color"
                name="color">

            <label>Upload Health Report</label>

            <input
                type="file"
                name="report">

            <label>Fitness Level</label>

            <input
                type="range"
                min="0"
                max="100">

            <div class="buttons">

                <input
                    type="submit"
                    value="Submit">

                <input
                    type="reset"
                    value="Reset">

            </div>

        </form>

    </div>

</body>
</html>
