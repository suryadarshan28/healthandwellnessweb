<!DOCTYPE html>
<html>

<head>
    <title>Health and Wellness Registration Form</title>
</head>

<body>

    <h2>Health and Wellness Registration Form</h2>

    <form>

        <label for="name">Full Name</label><br>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
            pattern="[A-Za-z ]+">
        <br><br>

        <label for="email">Email Address</label><br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required>
        <br><br>

        <label for="password">Create Password</label><br>
        <input
            type="password"
            id="password"
            name="password"
            required>
        <br><br>

        <label for="age">Age</label><br>
        <input
            type="number"
            id="age"
            name="age"
            min="15"
            max="80"
            required>
        <br><br>

        <label for="dob">Date of Birth</label><br>
        <input
            type="date"
            id="dob"
            name="dob"
            required>
        <br><br>

        <label>Gender</label><br>

        <input
            type="radio"
            name="gender"
            value="Male">
        Male

        <input
            type="radio"
            name="gender"
            value="Female">
        Female

        <input
            type="radio"
            name="gender"
            value="Other">
        Other

        <br><br>

        <label>Health Goals</label><br>

        <input
            type="checkbox"
            name="goal"
            value="Weight Loss">
        Weight Loss

        <input
            type="checkbox"
            name="goal"
            value="Fitness">
        Fitness

        <input
            type="checkbox"
            name="goal"
            value="Healthy Diet">
        Healthy Diet

        <br><br>

        <label>Exercise Frequency</label><br>

        <select required>
            <option value="">Select</option>
            <option>Daily</option>
            <option>3-5 Days a Week</option>
            <option>Occasionally</option>
            <option>Rarely</option>
        </select>

        <br><br>

        <label>Medical Notes</label><br>

        <textarea
            rows="4"
            cols="35"
            placeholder="Enter any health information"></textarea>

        <br><br>

        <label>Favorite Wellness Theme Color</label><br>

        <input type="color">

        <br><br>

        <label>Upload Health Report</label><br>

        <input type="file">

        <br><br>

        <label>Current Fitness Level</label><br>

        <input
            type="range"
            min="0"
            max="100">

        <br><br>

        <input
            type="submit"
            value="Submit">

        <input
            type="reset"
            value="Reset">

    </form>

</body>

</html>
