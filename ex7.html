<!DOCTYPE html>
<html>
<head>
    <title>Daily Water Intake Tracker</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background-color: #eaf7ff;
            text-align: center;
            padding: 30px;
        }

        .container {
            background: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            padding: 8px;
            width: 100px;
        }

        button {
            padding: 10px 15px;
            margin: 8px;
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #progress {
            width: 100%;
            height: 20px;
            background-color: #ddd;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background-color: #2196f3;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Daily Water Intake Tracker</h2>

        <p>Daily Goal (Litres):</p>
        <input type="number" id="goal" value="2" min="0.1" step="0.1">
        <button id="setGoal">Set Goal</button>

        <h3>Water Consumed</h3>
        <h2 id="total">0 ml</h2>

        <p id="remaining">Remaining: 2000 ml</p>

        <button id="addWater">Add 250 ml</button>
        <button id="reset">Reset</button>

        <div id="progress">
            <div id="progressBar"></div>
        </div>

        <p id="message">Start drinking water!</p>
    </div>

    <script>
        $(document).ready(function() {

            let goal = 2000;
            let consumed = 0;

            function updateTracker() {
                let remaining = Math.max(goal - consumed, 0);
                let percentage = Math.min((consumed / goal) * 100, 100);

                $("#total").text(consumed + " ml");
                $("#remaining").text("Remaining: " + remaining + " ml");
                $("#progressBar").css("width", percentage + "%");

                if (consumed >= goal) {
                    $("#message").text("Congratulations! Daily goal completed!");
                } else {
                    $("#message").text("Keep drinking water!");
                }
            }

            $("#setGoal").click(function() {
                let value = parseFloat($("#goal").val());

                if (isNaN(value) || value <= 0) {
                    alert("Please enter a valid goal.");
                    return;
                }

                goal = value * 1000;
                updateTracker();
            });

            $("#addWater").click(function() {
                consumed += 250;
                updateTracker();
            });

            $("#reset").click(function() {
                consumed = 0;
                updateTracker();
            });

            updateTracker();
        });
    </script>

</body>
</html>
